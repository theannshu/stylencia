<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGradientBright" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#E879F9" />
            <stop offset="50%" stopColor="#F472B6" />
            <stop offset="100%" stopColor="#C084FC" />
        </linearGradient>
    </defs>
    <rect width="100" height="100" rx="20" fill="#0f0c29"/>
    
    <!-- Outer Glow Look via Opacity -->
    <path
    d="M50 15 C50 15, 65 15, 65 22 C65 28, 55 35, 45 40 C35 45, 25 55, 30 70 C35 85, 50 90, 60 85 L65 82"
    stroke="#F472B6"
    strokeWidth="14"
    strokeLinecap="round"
    fill="none"
    opacity="0.3"
    />

    <!-- Main Stroke -->
    <path
    d="M50 15 C50 15, 65 15, 65 22 C65 28, 55 35, 45 40 C35 45, 25 55, 30 70 C35 85, 50 90, 60 85 L65 82"
    stroke="url(#logoGradientBright)"
    strokeWidth="8"
    strokeLinecap="round"
    fill="none"
    />
    
    <!-- Hook -->
    <path
    d="M50 15 C45 10, 50 5, 55 5 C60 5, 60 10, 60 10" 
    stroke="url(#logoGradientBright)"
    strokeWidth="8"
    strokeLinecap="round"
    fill="none"
    />

    <circle cx="65" cy="82" r="3" fill="#FFFFFF" />
</svg>
